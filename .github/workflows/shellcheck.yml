name: shellcheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe Bash
        run: bash -n bootstrap.sh templates/bin/wt-up templates/bin/wt-down
      - name: shellcheck
        run: shellcheck bootstrap.sh templates/bin/wt-up templates/bin/wt-down
